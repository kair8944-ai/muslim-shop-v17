<!DOCTYPE html>
<html lang="ru" style="background-color: #0B0B0E; color: #F4F1EA;">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSLIM SHOP — Перенаправление...</title>
    <script type="text/javascript">
      // GitHub Pages SPA Redirector
      (function() {
        var l = window.location;
        var pathParts = l.pathname.split('/').filter(Boolean);
        var repo = (pathParts.length > 0 && pathParts[0] !== 'product') ? '/' + pathParts[0] : '';
        
        var productMatch = l.pathname.match(/\/product\/([^/?#]+)/i);
        var searchParams = new URLSearchParams(l.search);
        
        if (productMatch && productMatch[1]) {
          searchParams.set('product', decodeURIComponent(productMatch[1]));
        }
        
        var newSearch = searchParams.toString() ? '?' + searchParams.toString() : '';
        var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repo + '/' + newSearch + l.hash;
        
        l.replace(targetUrl);
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0B0B0E;
        color: #E8D49E;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .loader {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(212, 175, 55, 0.2);
        border-top-color: #D4AF37;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div style="text-align: center;">
      <div class="loader"></div>
      <div style="font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;">MUSLIM SHOP — Загрузка...</div>
    </div>
  </body>
</html>
